# Production stack.
#
# Four application processes, not one. Omitting beat is the usual
# mistake: the periodic jobs then never run and both UserSession and
# OutstandingToken grow without bound.
#
# Secrets come from an env file that is never committed. Create it from
# backend/.env.production.example and keep it out of the image:
#
#   docker compose -f docker-compose.prod.yml --env-file ./secrets.env up -d
#
# This file assumes TLS is terminated by the nginx service. If you
# terminate elsewhere (a cloud load balancer, Cloudflare), drop that
# service and set TRUSTED_PROXY_COUNT to the real number of hops.

name: ${APP_SLUG:-app}

x-backend-base: &backend-base
  image: ${BACKEND_IMAGE:-ghormu-backend:local}
  build:
    context: .
    dockerfile: infra/docker/backend/Dockerfile
  restart: unless-stopped
  volumes:
    - media_data:/app/media
  env_file:
    - ${PRODUCTION_ENV_FILE:-./backend/.env.production}
  environment:
    DJANGO_SETTINGS_MODULE: config.settings.prod
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    REDIS_HOST: redis
    REDIS_PORT: "6379"
    TRUSTED_PROXY_COUNT: "1"
    # config.settings.prod defaults DB_SSLMODE to `require`, which is
    # right for a managed database reached over the network — and fatal
    # for the postgres service below, which speaks plaintext on a
    # private compose network:
    #   OperationalError: server does not support SSL, but SSL was required
    # Point POSTGRES_HOST at a managed instance and set DB_SSLMODE=require.
    DB_SSLMODE: ${DB_SSLMODE:-disable}
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  # Logs go to stdout and are collected by the daemon, so they need
  # bounding or a busy service fills the disk.
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped

    # Reads the same file Django does, so the credentials cannot drift
    # apart. Supplying them through ${...} substitution instead meant
    # two sources of truth - the shell for Postgres, the env file for
    # Django - and nothing to notice when they disagreed.
    env_file:
      - ${PRODUCTION_ENV_FILE:-./backend/.env.production}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    # Deliberately not published. The database is reachable only from
    # the compose network; exposing 5432 to the host is how databases
    # end up on the internet.
    expose:
      - "5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    restart: unless-stopped

    # Same single source of truth as Postgres.
    env_file:
      - ${PRODUCTION_ENV_FILE:-./backend/.env.production}

    # Redis holds session revocation state and the login lockout
    # counters. A password is not optional just because it is on a
    # private network.
    #
    # Wrapped in sh so REDIS_PASSWORD is expanded from the env file at
    # runtime; compose's ${...} substitution happens before env_file is
    # applied and would resolve to empty.
    command:
      - sh
      - -c
      - |
        set -e
        : "$${REDIS_PASSWORD:?REDIS_PASSWORD must be set in production}"
        exec redis-server --requirepass "$$REDIS_PASSWORD" --maxmemory ${REDIS_MAXMEMORY:-256mb} --maxmemory-policy noeviction --appendonly yes

    volumes:
      - redis_data:/data

    expose:
      - "6379"

    healthcheck:
      test:
        - CMD-SHELL
        - >-
          if [ -n "$$REDIS_PASSWORD" ];
          then redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping;
          else redis-cli ping; fi | grep -q PONG
      interval: 10s
      timeout: 5s
      retries: 5

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # Runs migrations once, then exits. Static assets are baked into the image.
  #
  # Separate from the web service so that N replicas do not race to
  # migrate the same database. The web service waits for it to complete
  # successfully.
  # ---------------------------------------------------------------------------
  migrate:
    <<: *backend-base
    restart: "no"
    healthcheck:
      disable: true
    command:
      - sh
      - -ec
      - |
        python manage.py migrate --noinput
        python manage.py sync_roles

  web:
    <<: *backend-base

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

    expose:
      - "8000"

    command:
      - gunicorn
      - config.wsgi:application
      - --bind=0.0.0.0:8000
      - --workers=${GUNICORN_WORKERS:-4}
      - --timeout=30
      - --graceful-timeout=30
      - --access-logfile=-
      - --error-logfile=-

    healthcheck:
      # Readiness, not liveness: this decides whether the container is
      # ready to receive traffic.
      test:
        - CMD-SHELL
        - >-
          python -c "import os,urllib.request,sys;
          sys.exit(0 if urllib.request.urlopen(
          urllib.request.Request('http://127.0.0.1:8000/health/ready/',
          headers={'Host':os.environ['ALLOWED_HOSTS'].split(',')[0].strip()}), timeout=5
          ).status == 200 else 1)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  worker:
    <<: *backend-base

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

    command:
      - celery
      - -A
      - config
      - worker
      - --loglevel=info
      - --concurrency=${CELERY_WORKER_CONCURRENCY:-4}

    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 30s

  # ---------------------------------------------------------------------------
  # The scheduler.
  #
  # Exactly one instance. Two beat processes double-schedule every job,
  # so this service must never be scaled - hence `deploy.replicas: 1`
  # and the note here rather than relying on anyone remembering.
  # ---------------------------------------------------------------------------
  beat:
    <<: *backend-base
    healthcheck:
      disable: true

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

    deploy:
      replicas: 1

    command:
      - celery
      - -A
      - config
      - beat
      - --loglevel=info
      - --scheduler=django_celery_beat.schedulers:DatabaseScheduler

  frontend:
    image: ${FRONTEND_IMAGE:-ghormu-frontend:local}
    build:
      context: .
      dockerfile: infra/docker/frontend/Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://example.com}
        NEXT_PUBLIC_APP_NAME: ${APP_NAME:-Ghormu}
        MEDIA_HOST: ${MEDIA_HOST:-}
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://web:8000
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?Set the HTTPS site origin}
      TRUST_EDGE_PROXY_HEADERS: "1"
      AUTH_COOKIE_PREFIX: ${APP_SLUG:-ghormu}
      # Checked by /api/revalidate; the backend sends the same value.
      REVALIDATE_SECRET: ${FRONTEND_REVALIDATE_SECRET:-}
    depends_on:
      web:
        condition: service_healthy
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  backup: &backup-base
    image: ${BACKUP_IMAGE:-ghormu-backup:local}
    profiles: [backup]
    build:
      context: .
      dockerfile: infra/docker/backup/Dockerfile
    env_file: ${PRODUCTION_ENV_FILE:-./backend/.env.production}
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
    depends_on:
      postgres:
        condition: service_healthy

  # Daily off-host backup and scratch restore, copied from Au Coeur.
  backup-scheduler:
    <<: *backup-base
    profiles: [backup-scheduler]
    restart: unless-stopped
    entrypoint: [sh, -ec, 'while true; do /usr/local/bin/backup; /usr/local/bin/restore --verify-latest; sleep 86400; done']
    healthcheck:
      test: [CMD-SHELL, 'test -f /tmp/last-restore-ok && test $$(($$(date +%s)-$$(cat /tmp/last-restore-ok))) -lt 90000']
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped

    depends_on:
      web:
        condition: service_healthy
      frontend:
        condition: service_healthy

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/sites:/etc/nginx/conf.d:ro
      - ./infra/nginx/certs:/etc/nginx/certs:ro
      - media_data:/var/www/media:ro
      # Certbot writes the ACME challenge here and nginx serves it over
      # plain HTTP. Without this volume renewal fails silently and the
      # certificate expires.
      - certbot_webroot:/var/www/certbot

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  media_data:
  postgres_data:
  redis_data:
  certbot_webroot:
