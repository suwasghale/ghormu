  /api/v1/auth/account/delete/:
    delete:
      operationId: auth_account_delete_destroy
      description: Soft delete the authenticated user's account. Requires the current
        password, plus a two-factor or recovery code when two-factor authentication
        is enabled, and revokes every session. Personal data is anonymized after the
        configured grace period.
      summary: Delete account
      tags:
      - Account
      security:
      - jwtAuth: []
      responses:
        '200':
          description: Account deleted.
        '400':
          description: Validation error.
        '401':
          description: Authentication required.
        '429':
          description: Too many requests.
