      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProjectList'
          description: ''
  /api/v1/me/addresses/:
    get:
      operationId: me_addresses_retrieve
      description: Retrieve all addresses belonging to the authenticated user.
      summary: List user addresses
      tags:
      - Address
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAddressList'
          description: Addresses retrieved successfully.
        '401':
          description: Authentication required.
    post:
      operationId: me_addresses_create
      description: Create a new address for the authenticated user.
      summary: Create address
      tags:
      - Address
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AddressCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AddressCreateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
          description: Address created successfully.
        '400':
          description: Validation error.
        '401':
          description: Authentication required.
  /api/v1/me/addresses/{address_id}/:
    patch:
      operationId: me_addresses_partial_update
      description: Update one of the authenticated user's addresses.
      summary: Update address
      parameters:
      - in: path
        name: address_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Address
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAddressUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAddressUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAddressUpdateRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
          description: Address updated successfully.
        '400':
          description: Validation error.
        '401':
          description: Authentication required.
        '404':
          description: Requested resource was not found.
    delete:
      operationId: me_addresses_destroy
      description: Delete one of the authenticated user's addresses.
      summary: Delete address
      parameters:
      - in: path
        name: address_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Address
      security:
      - jwtAuth: []
      responses:
        '200':
          description: Address deleted successfully.
        '401':
          description: Authentication required.
        '404':
          description: Requested resource was not found.
  /api/v1/me/addresses/{address_id}/default/:
    post:
      operationId: me_addresses_default_create
      description: Set one of the authenticated user's addresses as the default address.
      summary: Set default address
      parameters:
      - in: path
        name: address_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Address
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
          description: Default address updated successfully.
        '401':
          description: Authentication required.
        '404':
          description: Requested resource was not found.
  /api/v1/me/profile/:
    get:
      operationId: me_profile_retrieve
      description: Retrieve and update the authenticated user's profile.
      summary: Current user's profile
      tags:
      - Profile
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
          description: Profile retrieved successfully.
        '401':
          description: Authentication required.
    patch:
      operationId: me_profile_partial_update
