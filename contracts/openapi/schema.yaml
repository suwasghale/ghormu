components:
  schemas:
    Address:
      type: object
      description: Read serializer for user addresses.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        address_type:
          allOf:
          - $ref: '#/components/schemas/AddressTypeEnum'
          readOnly: true
        address_type_display:
          type: string
          readOnly: true
        label:
          type: string
          readOnly: true
          description: Optional custom label such as Parents' Home.
        street_address:
          type: string
          readOnly: true
        address_line_2:
          type: string
          readOnly: true
        city:
          type: string
          readOnly: true
        state:
          type: string
          readOnly: true
          title: State / Province
        postal_code:
          type: string
          readOnly: true
        country:
          allOf:
          - $ref: '#/components/schemas/CountryEnum'
          readOnly: true
        is_default:
          type: boolean
          readOnly: true
          title: Default address
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - address_line_2
      - address_type
      - address_type_display
      - city
      - country
      - created_at
      - id
      - is_default
      - label
      - postal_code
      - state
      - street_address
      - updated_at
    AddressCreateRequest:
      type: object
      description: Serializer for creating a user address.
      properties:
        address_type:
          $ref: '#/components/schemas/AddressTypeEnum'
        label:
          type: string
          description: Optional custom label such as Parents' Home.
          maxLength: 100
        street_address:
          type: string
          minLength: 1
          maxLength: 255
        address_line_2:
          type: string
          maxLength: 255
        city:
          type: string
          minLength: 1
          maxLength: 100
        state:
          type: string
          title: State / Province
          maxLength: 100
        postal_code:
          type: string
          maxLength: 20
        country:
          $ref: '#/components/schemas/CountryEnum'
        is_default:
          type: boolean
          title: Default address
      required:
      - city
      - country
      - street_address
    AddressTypeEnum:
      enum:
      - home
      - office
      - billing
      - shipping
      - other
      type: string
      description: |-
        * `home` - Home
        * `office` - Office
        * `billing` - Billing
        * `shipping` - Shipping
        * `other` - Other
    ChangePasswordRequest:
      type: object
      description: Validate change password request.
      properties:
        current_password:
          type: string
          writeOnly: true
          minLength: 1
        new_password:
          type: string
          writeOnly: true
          minLength: 1
        confirm_password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - confirm_password
      - current_password
      - new_password
    ConfirmEmailChangeRequest:
      type: object
      description: Validate an email change confirmation request.
      properties:
