    MFACodeRequest:
      type: object
      description: A code from the authenticator app, or a recovery code.
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 32
      required:
      - code
    MFADisableRequest:
      type: object
      description: |-
        Turning the second factor off.

        Requires the current password as well as a code: an attacker who
        has captured a live session should not be able to strip the second
        factor with the session alone.
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 32
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - code
      - password
    MFAEnrolStartResponse:
      type: object
      description: What the client needs to add the account to an authenticator app.
      properties:
        secret:
          type: string
          readOnly: true
        provisioning_uri:
          type: string
          readOnly: true
      required:
      - provisioning_uri
      - secret
    MFAStatus:
      type: object
      description: Whether the second factor is on, and how much recovery is left.
      properties:
        enabled:
          type: boolean
          readOnly: true
        recovery_codes_remaining:
          type: integer
          readOnly: true
      required:
      - enabled
      - recovery_codes_remaining
    MFAVerifyRequest:
      type: object
      description: Exchanging a login challenge for tokens.
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 32
        mfa_ticket:
          type: string
          minLength: 1
          maxLength: 128
      required:
      - code
      - mfa_ticket
    MediaUploadRequest:
      type: object
      description: Validates the envelope; ``process_image`` validates the bytes.
      properties:
        file:
          type: string
          format: binary
      required:
      - file
