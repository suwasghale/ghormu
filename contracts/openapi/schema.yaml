openapi: 3.0.3
info:
  title: Ghormu API
  version: v1 (v1)
  description: REST API for Ghormu.
  contact:
    name: Ghormu
    email: ''
    url: ''
  license:
    name: Proprietary
    url: ''
paths:
  /api/v1/admin/dashboard/:
    get:
      operationId: admin_dashboard_retrieve
      description: |-
        Staff-only base view.

        ``IsAuthenticated`` is listed alongside ``IsStaff`` even though
        ``IsStaff`` checks authentication itself: DRF picks the 401-vs-403
        distinction from the first failing permission, and without it an
        anonymous request gets 403 ("you lack access") where 401 ("log in")
        is the truthful answer.
      summary: Admin dashboard counters
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/admin/media/:
    post:
      operationId: admin_media_create
      description: Accept one image and return where it was stored.
      summary: Upload an image
      tags:
      - admin
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MediaUploadRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MediaUploadRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          description: No response body
  /api/v1/admin/users/:
    get:
      operationId: admin_users_list
      description: User accounts.
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUserAdminList'
          description: ''
    post:
      operationId: admin_users_create
      description: User accounts.
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserAdminRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserAdminRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserAdminRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAdmin'
          description: ''
  /api/v1/admin/users/{id}/:
    get:
      operationId: admin_users_retrieve
      description: |-
        One user account.

        Deletion is a soft delete: the model carries `deleted_at`, and rows
        referenced by sessions, security events and audit history must not
        vanish from under them.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAdmin'
          description: ''
    patch:
      operationId: admin_users_partial_update
      description: |-
        One user account.

        Deletion is a soft delete: the model carries `deleted_at`, and rows
        referenced by sessions, security events and audit history must not
        vanish from under them.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserAdminRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserAdminRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserAdminRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAdmin'
          description: ''
    delete:
      operationId: admin_users_destroy
      description: |-
        One user account.

        Deletion is a soft delete: the model carries `deleted_at`, and rows
        referenced by sessions, security events and audit history must not
        vanish from under them.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/account/delete/:
    delete:
      operationId: auth_account_delete_destroy
      description: Soft delete the authenticated user's account. Requires the current
        password and revokes every session.
      summary: Delete account
      tags:
      - Account
      security:
      - jwtAuth: []
      responses:
        '200':
          description: Account deleted.
        '400':
          description: Validation error.
        '401':
          description: Authentication required.
        '429':
          description: Too many requests.
  /api/v1/auth/email/change/confirm/:
    post:
      operationId: auth_email_change_confirm_create
      description: Confirm an email address change using the token from the confirmation
        link.
      summary: Confirm email change
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmEmailChangeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ConfirmEmailChangeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ConfirmEmailChangeRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          description: Email address updated.
        '400':
          description: Validation error.
        '429':
          description: Too many requests.
  /api/v1/auth/email/change/request/:
    post:
      operationId: auth_email_change_request_create
      description: Send a confirmation link to a new email address. The address is
        not changed until the link is used.
      summary: Request email change
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestEmailChangeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RequestEmailChangeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RequestEmailChangeRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          description: Verification email sent.
        '400':
          description: Validation error.
        '401':
          description: Authentication required.
        '429':
          description: Too many requests.
  /api/v1/auth/email/resend/:
    post:
      operationId: auth_email_resend_create
      description: Request a fresh verification email. For security reasons this endpoint
        always returns the same response regardless of whether the address is registered
        or already verified.
      summary: Resend email verification
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendVerificationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ResendVerificationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ResendVerificationRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          description: Verification email request accepted.
        '400':
          description: Validation error.
        '429':
          description: Too many requests.
  /api/v1/auth/email/verify/:
    post:
      operationId: auth_email_verify_create
      description: Verify a user's email address using the verification token.
      summary: Verify email address
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailVerificationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EmailVerificationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmailVerificationRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          description: Email verified successfully.
        '400':
          description: Validation error.
        '429':
          description: Too many requests.
  /api/v1/auth/login/:
    post:
      operationId: auth_login_create
      description: Authenticate a user using email and password.
      summary: User login
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          description: Login successful.
        '400':
          description: Validation error.
        '429':
          description: Too many requests.
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout_create
      description: Blacklist the supplied refresh token and close its session. The
        access token derived from it stops working immediately.
      summary: Logout
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          description: Logout successful.
        '400':
          description: Validation error.
        '401':
          description: Authentication required.
  /api/v1/auth/logout/all/:
    post:
      operationId: auth_logout_all_create
      description: Blacklist every outstanding refresh token belonging to the authenticated
        user.
      summary: Logout from all devices
      tags:
      - Authentication
      security:
      - jwtAuth: []
      responses:
        '200':
          description: Logged out from all devices.
        '401':
          description: Authentication required.
  /api/v1/auth/me/:
    get:
      operationId: auth_me_retrieve
      description: Identity and account status for the signed-in user. Profile details
        are served separately at /me/profile/.
      summary: Current authenticated user
      tags:
      - Authentication
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
          description: Current user retrieved successfully.
        '401':
          description: Authentication required.
  /api/v1/auth/mfa/:
    get:
      operationId: auth_mfa_retrieve
      description: Whether a second factor is active on this account.
      summary: Two-factor status
      tags:
      - MFA
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MFAStatus'
          description: Status retrieved.
        '401':
          description: Authentication required.
  /api/v1/auth/mfa/confirm/:
    post:
      operationId: auth_mfa_confirm_create
      description: Activates the pending device and returns recovery codes. The codes
        are shown once and cannot be retrieved again.
      summary: Confirm two-factor enrolment
      tags:
      - MFA
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MFACodeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MFACodeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MFACodeRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryCodesResponse'
          description: Two-factor authentication enabled.
        '400':
          description: Validation error.
        '401':
          description: Authentication required.
        '429':
          description: Too many requests.
  /api/v1/auth/mfa/disable/:
    post:
      operationId: auth_mfa_disable_create
      description: Remove the second factor.
      summary: Disable two-factor authentication
      tags:
      - MFA
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MFADisableRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MFADisableRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MFADisableRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          description: Two-factor disabled.
        '400':
          description: Validation error.
        '401':
          description: Authentication required.
        '429':
          description: Too many requests.
  /api/v1/auth/mfa/enrol/:
    post:
      operationId: auth_mfa_enrol_create
      description: Returns a secret and an otpauth:// URI for an authenticator app.
        The factor is not active until confirmed.
      summary: Begin two-factor enrolment
      tags:
      - MFA
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MFAEnrolStartResponse'
          description: Enrolment started.
        '400':
          description: Validation error.
        '401':
          description: Authentication required.
        '429':
          description: Too many requests.
  /api/v1/auth/mfa/recovery-codes/:
    post:
      operationId: auth_mfa_recovery_codes_create
      description: Replaces every existing recovery code. Previous codes stop working
        immediately.
      summary: Regenerate recovery codes
      tags:
      - MFA
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MFACodeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MFACodeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MFACodeRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryCodesResponse'
          description: Recovery codes regenerated.
        '400':
          description: Validation error.
        '401':
          description: Authentication required.
        '429':
          description: Too many requests.
  /api/v1/auth/mfa/verify/:
    post:
      operationId: auth_mfa_verify_create
      description: Exchanges the ticket returned by a login that answered `mfa_required`
        for a token pair.
      summary: Complete sign-in with a second factor
      tags:
      - MFA
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MFAVerifyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MFAVerifyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MFAVerifyRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          description: Sign-in complete.
        '400':
          description: Validation error.
        '401':
          description: Authentication required.
        '429':
          description: Too many requests.
  /api/v1/auth/password/change/:
    post:
      operationId: auth_password_change_create
      description: Change the password of the currently authenticated user. Every
        existing session is revoked, including the caller's, so a replacement token
        pair is returned. Clients must store it and discard the previous one.
      summary: Change password
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginTokens'
          description: Password changed successfully.
        '400':
          description: Validation error.
        '401':
          description: Authentication required.
        '429':
          description: Too many requests.
  /api/v1/auth/password/forgot/:
    post:
      operationId: auth_password_forgot_create
      description: Request a password reset email. For security reasons, this endpoint
        always returns the same response regardless of whether the email exists.
      summary: Forgot password
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          description: Password reset request accepted.
        '400':
          description: Validation error.
        '429':
          description: Too many requests.
  /api/v1/auth/password/reset/:
    post:
      operationId: auth_password_reset_create
      description: Reset a user's password using a valid password reset token. Completing
        a reset revokes every existing session.
      summary: Reset password
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
            examples:
              ResetPassword:
                value:
                  token: 2KFJ7EnClpU67a4uOYgERqjF1PwUlqcu3nrPUFVk_5w
                  password: MySecurePassword123!
                  password_confirm: MySecurePassword123!
                summary: Reset password
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          description: Password successfully updated.
        '400':
          description: Validation error.
        '429':
          description: Too many requests.
  /api/v1/auth/refresh/:
    post:
      operationId: auth_refresh_create
      description: Exchange a refresh token for a new token pair. The presented refresh
        token is blacklisted; presenting it again is treated as theft and revokes
        every session for the account.
      summary: Refresh access token
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefreshResponse'
          description: Access token refreshed.
        '401':
          description: Authentication required.
        '429':
          description: Too many requests.
  /api/v1/auth/register/:
    post:
      operationId: auth_register_create
      description: Create a new user account.
      summary: Register a new user
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegistrationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegistrationRequest'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationResponse'
          description: Registration successful.
        '400':
          description: Validation error.
        '429':
          description: Too many requests.
  /api/v1/auth/security/sessions/:
    get:
      operationId: auth_security_sessions_retrieve
      description: Retrieve every active session belonging to the authenticated user.
      summary: List active sessions
      tags:
      - Security
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSessionList'
          description: Sessions retrieved successfully.
        '401':
          description: Authentication required.
  /api/v1/auth/security/sessions/{session_id}/:
    delete:
      operationId: auth_security_sessions_destroy
      description: Revoke one active session belonging to the authenticated user.
      summary: Revoke session
      parameters:
      - in: path
        name: session_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Security
      security:
      - jwtAuth: []
      responses:
        '200':
          description: Session revoked successfully.
        '401':
          description: Authentication required.
        '403':
          description: Permission denied.
        '404':
          description: Requested resource was not found.
  /api/v1/auth/security/trusted-devices/:
    get:
      operationId: auth_security_trusted_devices_retrieve
      description: List trusted devices.
      summary: List trusted devices
      tags:
      - Security
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTrustedDeviceList'
          description: Trusted devices retrieved successfully.
        '401':
          description: Authentication required.
  /api/v1/auth/security/trusted-devices/{session_id}/trust/:
    post:
      operationId: auth_security_trusted_devices_trust_create
      description: Trust a device.
      summary: Trust device
      parameters:
      - in: path
        name: session_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Security
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrustedDevice'
          description: Device trusted successfully.
        '401':
          description: Authentication required.
        '404':
          description: Requested resource was not found.
  /api/v1/auth/security/trusted-devices/{session_id}/untrust/:
    delete:
      operationId: auth_security_trusted_devices_untrust_destroy
      description: Remove trust from a device.
      summary: Untrust device
      parameters:
      - in: path
        name: session_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Security
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrustedDevice'
          description: Device removed from trusted devices.
        '401':
          description: Authentication required.
        '404':
          description: Requested resource was not found.
  /api/v1/auth/social/:
    get:
      operationId: auth_social_retrieve
      description: Which social providers this deployment has configured.
      summary: List configured sign-in providers
      tags:
      - Authentication
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SocialProviderList'
          description: Providers retrieved.
  /api/v1/auth/social/{provider}/authorize/:
    post:
      operationId: auth_social_authorize_create
      description: Returns the provider URL to send the user to, plus the state value
        that must come back with the callback.
      summary: Begin social sign-in
      parameters:
      - in: path
        name: provider
        schema:
          type: string
        required: true
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SocialAuthorizeRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SocialAuthorizeRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SocialAuthorizeRequestRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SocialAuthorizeResponse'
          description: Authorization URL generated.
        '404':
          description: Requested resource was not found.
        '429':
          description: Too many requests.
  /api/v1/auth/social/{provider}/callback/:
    post:
      operationId: auth_social_callback_create
      description: Exchanges an authorization code for a session. The `state` must
        match the one issued by the authorize step.
      summary: Complete social sign-in
      parameters:
      - in: path
        name: provider
        schema:
          type: string
        required: true
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SocialCallbackRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SocialCallbackRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SocialCallbackRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          description: Sign-in successful.
        '400':
          description: Validation error.
        '404':
          description: Requested resource was not found.
        '429':
          description: Too many requests.
  /api/v1/me/addresses/:
    get:
      operationId: me_addresses_retrieve
      description: Retrieve all addresses belonging to the authenticated user.
      summary: List user addresses
      tags:
      - Address
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAddressList'
          description: Addresses retrieved successfully.
        '401':
          description: Authentication required.
    post:
      operationId: me_addresses_create
      description: Create a new address for the authenticated user.
      summary: Create address
      tags:
      - Address
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AddressCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AddressCreateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
          description: Address created successfully.
        '400':
          description: Validation error.
        '401':
          description: Authentication required.
  /api/v1/me/addresses/{address_id}/:
    patch:
      operationId: me_addresses_partial_update
      description: Update one of the authenticated user's addresses.
      summary: Update address
      parameters:
