          type: string
          format: date-time
          readOnly: true
        last_activity:
          type: string
          format: date-time
          readOnly: true
        is_trusted:
          type: boolean
          readOnly: true
          title: Trusted device
        mfa_verified:
          type: boolean
          readOnly: true
        risk_score:
          type: integer
          readOnly: true
