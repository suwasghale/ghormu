    CurrentUser:
      type: object
      description: |-
        Identity and account status for the signed-in user.

        Deliberately contains identity only. It previously nested the
        profile and the address list, which made the users app import from
        the profiles app - so deleting profiles broke authentication, and
        the auth system could not be reused without dragging an Address
        model along with it.

        Profile data is served by the profiles app at /me/profile/.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: Unique identifier for the user.
        email:
          type: string
          format: email
          readOnly: true
          title: Email address
          description: Unique email address used for authentication.
        first_name:
          type: string
          readOnly: true
        last_name:
          type: string
          readOnly: true
        full_name:
          type: string
          description: |-
            Return the user's full name.

            Returns:
                str: First name and last name combined, with extra whitespace removed.
          readOnly: true
        is_verified:
          type: boolean
          readOnly: true
          title: Verified
          description: Indicates whether the user's email address has been verified.
        is_staff:
          type: boolean
          readOnly: true
          title: Staff status
          description: Designates whether the user can access the admin site.
        is_superuser:
          type: boolean
          readOnly: true
          title: Superuser status
          description: Designates that this user has all permissions without explicitly
            assigning them.
        is_active:
          type: boolean
          readOnly: true
          title: Active
          description: Designates whether this account is active.
        date_joined:
          type: string
          format: date-time
          readOnly: true
        last_seen:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - date_joined
      - email
      - first_name
      - full_name
      - id
      - is_active
      - is_staff
      - is_superuser
      - is_verified
      - last_name
      - last_seen
    DeviceTypeEnum:
      enum:
      - desktop
      - laptop
      - tablet
      - phone
      - bot
      - unknown
      type: string
      description: |-
        * `desktop` - Desktop
        * `laptop` - Laptop
        * `tablet` - Tablet
        * `phone` - Phone
        * `bot` - Bot
        * `unknown` - Unknown
    EmailVerificationRequest:
      type: object
      description: Validate an email verification token.
      properties:
        token:
          type: string
          minLength: 1
          description: Raw email verification token.
          maxLength: 255
      required:
      - token
    Event:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        category:
          $ref: '#/components/schemas/CategoryEnum'
        title:
          type: string
          readOnly: true
        description:
          type: string
          readOnly: true
        location:
          type: string
          readOnly: true
        starts_on:
          type: string
          format: date
        ends_on:
          type: string
          format: date
          nullable: true
          description: Leave empty for a one-day event.
        image_url:
          type: string
          title: Image
          maxLength: 500
      required:
      - description
      - id
      - location
      - starts_on
      - title
    EventAdmin:
      type: object
      description: |-
        Run the model's own ``clean()`` before saving.

        DRF does not call it, so rules that live on the model (no reserved
        slug, consent before publishing, a credit on satellite images) would be
        enforced in the Django admin and silently skipped here.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        status:
          $ref: '#/components/schemas/PublicationStatusEnum'
        published_at:
          type: string
          format: date-time
          nullable: true
          description: When this becomes publicly visible. Leave empty to publish
            as soon as the status is set to published.
        category:
          $ref: '#/components/schemas/CategoryEnum'
        title_ne:
          type: string
          title: Title (Nepali)
          maxLength: 200
        title_en:
          type: string
          title: Title (English)
          maxLength: 200
        description_ne:
          type: string
          title: Description (Nepali)
          maxLength: 2000
        description_en:
          type: string
          title: Description (English)
          maxLength: 2000
        location_ne:
          type: string
          title: Place (Nepali)
          maxLength: 200
        location_en:
          type: string
          title: Place (English)
          maxLength: 200
        starts_on:
          type: string
          format: date
        ends_on:
          type: string
          format: date
          nullable: true
          description: Leave empty for a one-day event.
        image_url:
          type: string
          title: Image
          maxLength: 500
      required:
      - created_at
      - id
      - starts_on
      - title_ne
      - updated_at
    EventAdminRequest:
      type: object
      description: |-
        Run the model's own ``clean()`` before saving.

