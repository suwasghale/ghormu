        * `ongoing` - Ongoing
        * `completed` - Completed
    TokenRefreshRequest:
      type: object
      properties:
        refresh:
          type: string
          minLength: 1
      required:
      - refresh
    TokenRefreshResponse:
      type: object
      properties:
        access:
          type: string
        refresh:
          type: string
      required:
      - access
      - refresh
    TopicEnum:
      enum:
      - general
      - feedback
      - correction
      - archive
      - travel
      - support
      type: string
      description: |-
        * `general` - General question
        * `feedback` - Feedback or suggestion
        * `correction` - Correction to the website
        * `archive` - Photos, stories or documents to share
        * `travel` - Visiting Ghormu
        * `support` - Supporting Ghormu
    TrustedDevice:
      type: object
      description: Serialize a trusted device.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        session_key:
          type: string
          format: uuid
          readOnly: true
        device_name:
          type: string
          readOnly: true
        device_type:
          allOf:
          - $ref: '#/components/schemas/DeviceTypeEnum'
          readOnly: true
        browser:
          type: string
          readOnly: true
        browser_version:
          type: string
          readOnly: true
        operating_system:
          type: string
          readOnly: true
        operating_system_version:
          type: string
          readOnly: true
        country:
          type: string
          readOnly: true
        city:
          type: string
          readOnly: true
        ip_address:
          type: string
          readOnly: true
          nullable: true
        login_method:
          allOf:
          - $ref: '#/components/schemas/LoginMethodEnum'
          readOnly: true
