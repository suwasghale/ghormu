    CurrentUser:
      type: object
      description: |-
        Identity and account status for the signed-in user.

        Deliberately contains identity only. It previously nested the
        profile and the address list, which made the users app import from
        the profiles app - so deleting profiles broke authentication, and
        the auth system could not be reused without dragging an Address
        model along with it.

        Profile data is served by the profiles app at /me/profile/.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: Unique identifier for the user.
        email:
          type: string
          format: email
          readOnly: true
          title: Email address
          description: Unique email address used for authentication.
        first_name:
          type: string
          readOnly: true
        last_name:
          type: string
          readOnly: true
        full_name:
          type: string
          description: |-
            Return the user's full name.

            Returns:
                str: First name and last name combined, with extra whitespace removed.
          readOnly: true
        is_verified:
          type: boolean
          readOnly: true
          title: Verified
          description: Indicates whether the user's email address has been verified.
        is_staff:
          type: boolean
          readOnly: true
          title: Staff status
          description: Designates whether the user can access the admin site.
        is_superuser:
          type: boolean
          readOnly: true
          title: Superuser status
          description: Designates that this user has all permissions without explicitly
            assigning them.
        is_active:
          type: boolean
          readOnly: true
          title: Active
          description: Designates whether this account is active.
        date_joined:
          type: string
          format: date-time
          readOnly: true
        last_seen:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - date_joined
      - email
      - first_name
      - full_name
      - id
      - is_active
      - is_staff
      - is_superuser
      - is_verified
      - last_name
      - last_seen
    DeviceTypeEnum:
      enum:
      - desktop
      - laptop
      - tablet
      - phone
      - bot
      - unknown
      type: string
      description: |-
        * `desktop` - Desktop
        * `laptop` - Laptop
        * `tablet` - Tablet
        * `phone` - Phone
        * `bot` - Bot
        * `unknown` - Unknown
    EmailVerificationRequest:
      type: object
      description: Validate an email verification token.
      properties:
        token:
          type: string
          minLength: 1
          description: Raw email verification token.
          maxLength: 255
      required:
      - token
    ForgotPasswordRequest:
      type: object
      description: Validate password reset request.
      properties:
        email:
          type: string
          format: email
          minLength: 1
      required:
      - email
    GenderEnum:
      enum:
      - male
      - female
      - other
      - prefer_not_to_say
      type: string
      description: |-
        * `male` - Male
        * `female` - Female
        * `other` - Other
        * `prefer_not_to_say` - Prefer not to say
    LoginMethodEnum:
      enum:
      - password
      - google
      - github
      - apple
      - microsoft
      - magic_link
      - api_key
      type: string
      description: |-
        * `password` - Password
        * `google` - Google
        * `github` - GitHub
        * `apple` - Apple
        * `microsoft` - Microsoft
        * `magic_link` - Magic Link
        * `api_key` - API Key
    LoginRequest:
      type: object
      description: Validate login credentials.
      properties:
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - email
      - password
    LoginResponse:
      type: object
      description: Login response.
      properties:
        user:
          allOf:
          - $ref: '#/components/schemas/LoginUser'
          readOnly: true
        tokens:
          allOf:
          - $ref: '#/components/schemas/LoginTokens'
          readOnly: true
      required:
      - tokens
      - user
    LoginTokens:
      type: object
      description: JWT tokens.
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          readOnly: true
      required:
      - access
      - refresh
    LoginUser:
      type: object
      description: Public user information.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: Unique identifier for the user.
        email:
          type: string
          format: email
          readOnly: true
          title: Email address
          description: Unique email address used for authentication.
        first_name:
          type: string
          readOnly: true
        last_name:
          type: string
          readOnly: true
        is_verified:
          type: boolean
          readOnly: true
          title: Verified
          description: Indicates whether the user's email address has been verified.
        is_staff:
          type: boolean
          readOnly: true
          title: Staff status
          description: Designates whether the user can access the admin site.
        is_superuser:
          type: boolean
          readOnly: true
          title: Superuser status
          description: Designates that this user has all permissions without explicitly
            assigning them.
        is_active:
          type: boolean
          readOnly: true
          title: Active
          description: Designates whether this account is active.
      required:
      - email
      - first_name
      - id
      - is_active
      - is_staff
      - is_superuser
      - is_verified
      - last_name
    LogoutRequest:
      type: object
      description: Logout request.
      properties:
        refresh:
          type: string
          minLength: 1
      required:
      - refresh
    MFACodeRequest:
      type: object
      description: A code from the authenticator app, or a recovery code.
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 32
      required:
      - code
    MFADisableRequest:
      type: object
      description: |-
        Turning the second factor off.

        Requires the current password as well as a code: an attacker who
        has captured a live session should not be able to strip the second
        factor with the session alone.
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 32
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - code
      - password
    MFAEnrolStartResponse:
      type: object
      description: What the client needs to add the account to an authenticator app.
      properties:
        secret:
          type: string
          readOnly: true
        provisioning_uri:
          type: string
          readOnly: true
      required:
      - provisioning_uri
      - secret
    MFAStatus:
      type: object
      description: Whether the second factor is on, and how much recovery is left.
      properties:
        enabled:
          type: boolean
          readOnly: true
        recovery_codes_remaining:
          type: integer
          readOnly: true
      required:
      - enabled
      - recovery_codes_remaining
    MFAVerifyRequest:
      type: object
      description: Exchanging a login challenge for tokens.
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 32
        mfa_ticket:
          type: string
          minLength: 1
          maxLength: 128
      required:
      - code
      - mfa_ticket
    MediaUploadRequest:
      type: object
      description: Validates the envelope; ``process_image`` validates the bytes.
      properties:
        file:
          type: string
          format: binary
      required:
      - file
    PaginatedAddressList:
