components:
  schemas:
    Address:
      type: object
      description: Read serializer for user addresses.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        address_type:
          allOf:
          - $ref: '#/components/schemas/AddressTypeEnum'
          readOnly: true
        address_type_display:
          type: string
          readOnly: true
        label:
          type: string
          readOnly: true
          description: Optional custom label such as Parents' Home.
        street_address:
          type: string
          readOnly: true
        address_line_2:
          type: string
          readOnly: true
        city:
          type: string
          readOnly: true
        state:
          type: string
          readOnly: true
          title: State / Province
        postal_code:
          type: string
          readOnly: true
        country:
          allOf:
          - $ref: '#/components/schemas/CountryEnum'
          readOnly: true
        is_default:
          type: boolean
          readOnly: true
          title: Default address
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - address_line_2
      - address_type
      - address_type_display
      - city
      - country
      - created_at
      - id
      - is_default
      - label
      - postal_code
      - state
      - street_address
      - updated_at
    AddressCreateRequest:
      type: object
      description: Serializer for creating a user address.
      properties:
        address_type:
          $ref: '#/components/schemas/AddressTypeEnum'
        label:
          type: string
          description: Optional custom label such as Parents' Home.
          maxLength: 100
        street_address:
          type: string
          minLength: 1
          maxLength: 255
        address_line_2:
          type: string
          maxLength: 255
        city:
          type: string
          minLength: 1
          maxLength: 100
        state:
          type: string
          title: State / Province
          maxLength: 100
        postal_code:
          type: string
          maxLength: 20
        country:
          $ref: '#/components/schemas/CountryEnum'
        is_default:
          type: boolean
          title: Default address
      required:
      - city
      - country
      - street_address
    AddressTypeEnum:
      enum:
      - home
      - office
      - billing
      - shipping
      - other
      type: string
      description: |-
        * `home` - Home
        * `office` - Office
        * `billing` - Billing
        * `shipping` - Shipping
        * `other` - Other
    ArchiveItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        slug:
          type: string
          description: 'Part of the address: /about/archive/<slug>.'
          maxLength: 80
          pattern: ^[-a-zA-Z0-9_]+$
        kind:
          $ref: '#/components/schemas/ArchiveKindEnum'
        title:
          type: string
          readOnly: true
        description:
          type: string
          readOnly: true
        year:
          type: integer
          maximum: 2200
          minimum: 1800
          nullable: true
          title: Year (AD)
          description: Gregorian year, exact or best guess. Used for sorting and decades.
        date_label:
          type: string
          readOnly: true
        place:
          type: string
          readOnly: true
        credit:
          type: string
          description: 'Who gave or took it, or the required credit line, e.g. "Imagery:
            Google, Maxar Technologies".'
          maxLength: 300
        image_url:
          type: string
          title: Image
          maxLength: 500
      required:
      - date_label
      - description
      - id
      - place
      - title
    ArchiveItemAdmin:
      type: object
      description: |-
        Run the model's own ``clean()`` before saving.

        DRF does not call it, so rules that live on the model (no reserved
        slug, consent before publishing, a credit on satellite images) would be
        enforced in the Django admin and silently skipped here.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        status:
          $ref: '#/components/schemas/PublicationStatusEnum'
        published_at:
          type: string
          format: date-time
          nullable: true
          description: When this becomes publicly visible. Leave empty to publish
            as soon as the status is set to published.
        kind:
          $ref: '#/components/schemas/ArchiveKindEnum'
        slug:
          type: string
          description: 'Part of the address: /about/archive/<slug>.'
          maxLength: 80
          pattern: ^[-a-zA-Z0-9_]+$
        title_ne:
          type: string
          title: Title (Nepali)
          maxLength: 200
        title_en:
          type: string
          title: Title (English)
          maxLength: 200
        description_ne:
          type: string
          title: Story (Nepali)
          maxLength: 4000
        description_en:
          type: string
          title: Story (English)
          maxLength: 4000
        year:
          type: integer
          maximum: 2200
          minimum: 1800
          nullable: true
          title: Year (AD)
          description: Gregorian year, exact or best guess. Used for sorting and decades.
        date_label_ne:
          type: string
          title: Date shown (Nepali)
          description: How to show the date, e.g. "करिब २०४५ साल".
          maxLength: 100
        date_label_en:
          type: string
          title: Date shown (English)
          maxLength: 100
        place_ne:
          type: string
          title: Place (Nepali)
          maxLength: 200
        place_en:
          type: string
          title: Place (English)
          maxLength: 200
        credit:
          type: string
          description: 'Who gave or took it, or the required credit line, e.g. "Imagery:
            Google, Maxar Technologies".'
          maxLength: 300
        image_url:
          type: string
          title: Image
          maxLength: 500
        consent_confirmed:
          type: boolean
          title: Permission confirmed
          description: The owner, and anyone recognisable in it, agreed to publication.
      required:
      - created_at
      - id
      - title_ne
      - updated_at
    ArchiveItemAdminRequest:
      type: object
      description: |-
        Run the model's own ``clean()`` before saving.

        DRF does not call it, so rules that live on the model (no reserved
        slug, consent before publishing, a credit on satellite images) would be
        enforced in the Django admin and silently skipped here.
      properties:
        status:
          $ref: '#/components/schemas/PublicationStatusEnum'
        published_at:
          type: string
          format: date-time
          nullable: true
          description: When this becomes publicly visible. Leave empty to publish
            as soon as the status is set to published.
        kind:
          $ref: '#/components/schemas/ArchiveKindEnum'
        slug:
          type: string
          description: 'Part of the address: /about/archive/<slug>.'
          maxLength: 80
          pattern: ^[-a-zA-Z0-9_]+$
        title_ne:
          type: string
          minLength: 1
          title: Title (Nepali)
          maxLength: 200
        title_en:
          type: string
          title: Title (English)
          maxLength: 200
        description_ne:
          type: string
          title: Story (Nepali)
          maxLength: 4000
        description_en:
          type: string
          title: Story (English)
          maxLength: 4000
        year:
          type: integer
          maximum: 2200
          minimum: 1800
          nullable: true
          title: Year (AD)
          description: Gregorian year, exact or best guess. Used for sorting and decades.
        date_label_ne:
          type: string
          title: Date shown (Nepali)
          description: How to show the date, e.g. "करिब २०४५ साल".
          maxLength: 100
        date_label_en:
          type: string
          title: Date shown (English)
          maxLength: 100
        place_ne:
          type: string
          title: Place (Nepali)
          maxLength: 200
        place_en:
          type: string
          title: Place (English)
          maxLength: 200
        credit:
          type: string
          description: 'Who gave or took it, or the required credit line, e.g. "Imagery:
            Google, Maxar Technologies".'
          maxLength: 300
        image_url:
          type: string
          title: Image
          maxLength: 500
        consent_confirmed:
          type: boolean
          title: Permission confirmed
          description: The owner, and anyone recognisable in it, agreed to publication.
      required:
      - title_ne
    ArchiveKindEnum:
      enum:
      - photo
      - document
      - map
      - satellite
      type: string
      description: |-
        * `photo` - Photo
        * `document` - Document
        * `map` - Map
        * `satellite` - Satellite image
    CategoryEnum:
      enum:
      - festival
      - ceremony
      - meeting
      - community
      - sports
      - other
      type: string
      description: |-
        * `festival` - Festival
        * `ceremony` - Ceremony
        * `meeting` - Meeting
        * `community` - Community programme
        * `sports` - Sports
        * `other` - Other
    ChangePasswordRequest:
      type: object
      description: Validate change password request.
      properties:
        current_password:
          type: string
          writeOnly: true
          minLength: 1
        new_password:
          type: string
          writeOnly: true
          minLength: 1
        confirm_password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - confirm_password
      - current_password
      - new_password
    ConfirmEmailChangeRequest:
      type: object
      description: Validate an email change confirmation request.
      properties:
        token:
          type: string
          minLength: 1
          description: Email change verification token.
      required:
      - token
    ContactMessageAdmin:
      type: object
      description: |-
        Staff can mark a message handled and keep a note; what the sender wrote
        is a record and stays as sent.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        name:
          type: string
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        phone:
          type: string
          readOnly: true
        topic:
          allOf:
          - $ref: '#/components/schemas/TopicEnum'
          readOnly: true
        message:
          type: string
          readOnly: true
        language:
          allOf:
          - $ref: '#/components/schemas/LanguageEnum'
          readOnly: true
          description: |-
            The language the sender wrote from, to reply in it.

            * `ne` - नेपाली
            * `en` - English
        handled:
          type: boolean
        staff_note:
          type: string
          description: Visible to staff only.
      required:
      - created_at
      - email
      - id
      - language
      - message
      - name
      - phone
      - topic
      - updated_at
    ContactMessageAdminRequest:
      type: object
      description: |-
        Staff can mark a message handled and keep a note; what the sender wrote
        is a record and stays as sent.
      properties:
        handled:
          type: boolean
        staff_note:
          type: string
          description: Visible to staff only.
    ContactSubmissionRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        email:
          type: string
          format: email
          default: ''
        phone:
          type: string
          default: ''
          maxLength: 40
        topic:
