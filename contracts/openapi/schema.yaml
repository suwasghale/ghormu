  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |-
        Access token from POST /api/v1/auth/login/, sent as `Authorization: Bearer <token>`.

        Tokens are bound to a server-side session, so revoking the session rejects the token on its next use rather than at expiry.
servers:
- url: http://localhost:8010
  description: Current API Server
tags:
- name: Authentication
  description: Registration, sign-in, token rotation and password management.
- name: Account
  description: The authenticated user's own profile.
- name: Address
  description: The authenticated user's addresses.
- name: Security
  description: Active sessions and trusted devices.
- name: Health
  description: Liveness and readiness probes.
