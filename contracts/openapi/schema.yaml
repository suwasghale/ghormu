  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |-
        Access token from POST /api/v1/auth/login/, sent as `Authorization: Bearer <token>`.

        Tokens are bound to a server-side session, so revoking the session rejects the token on its next use rather than at expiry.
