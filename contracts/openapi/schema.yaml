        Read-only, unauthenticated, language-aware, cacheable.

        Authentication is disabled rather than merely permitted, for the same
        reason ``PublicAPIView`` does it: an expired ``Authorization`` header
        from a logged-in editor browsing the site should not turn a public
        read into a 401.
      parameters:
      - in: query
        name: decade
        schema:
          type: integer
        description: First year of a decade, e.g. 1990.
      - in: query
        name: kind
        schema:
          type: string
          enum:
          - document
          - map
          - photo
          - satellite
      - in: query
        name: lang
        schema:
          type: string
          enum:
          - en
          - ne
        description: 'Content language: `ne` (default) or `en`.'
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - content
      security:
      - {}
      responses:
        '200':
