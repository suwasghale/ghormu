version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directories:
      - /infra/docker/backend
      - /infra/docker/frontend
      - /infra/docker/backup
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: docker-compose
    directories: ["/", "/infra/e2e"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
# pnpm 11 is newer than GitHub's documented Dependabot support (pnpm <=10).
# The maintenance workflow audits the frozen frontend lock weekly; maintainers
# update it with pnpm until their update bot supports the pinned package manager.
