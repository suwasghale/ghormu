name: Frontend

on:
  workflow_call:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend

env:
  NEXT_PUBLIC_SITE_URL: https://example.com
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  # ---------------------------------------------------------------------------
  # Types and lint first. Both are fast and catch most of what breaks, so
  # they report in about a minute rather than after a full build.
  # ---------------------------------------------------------------------------
  check:
    name: Types and lint
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # Matches the lockfile format (lockfileVersion 9.0). Pinned
          # rather than floating: a pnpm major bump rewriting the lockfile
          # during CI is how --frozen-lockfile starts failing for reasons
          # unrelated to the change under review.
          version: 11.20.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Same major as infra/docker/frontend/Dockerfile. CI passing on a
          # runtime production does not use is worth very little.
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        # Fails rather than silently updating the lockfile, so a dependency
        # cannot change without showing up in the diff.
        run: pnpm install --frozen-lockfile

      - name: Types
        run: pnpm typecheck

      - name: Dependency vulnerabilities
        run: pnpm audit --audit-level=high

      - name: Authentication tests
        run: pnpm test

      - name: Lint
        # Errors fail the run; warnings are printed and do not. There are a
        # handful of long-standing warnings, and a hard gate on a codebase
        # that already has some is a gate someone disables within a month.
        run: pnpm lint

  # ---------------------------------------------------------------------------
  # The build is the only thing that exercises static generation, which is
  # where this project's real regressions have been: a page silently
  # dropping out of the prerendered set still typechecks and still lints.
  # ---------------------------------------------------------------------------
  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: check

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.20.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

