name: Publish images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-main
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  validate-backend:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/backend.yml
  validate-frontend:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/frontend.yml
  validate-production:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/production-validation.yml

  validate-integration:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/integration.yml

  build:
    if: vars.ENABLE_RELEASES == 'true'
    # A successful image build alone is not a release gate. All validation
    # workflows run against this exact checkout before any image is published.
    needs: [validate-backend, validate-frontend, validate-production, validate-integration]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        service: [backend, frontend, backup]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Read the site identity
        # Origin, name and media host are compiled into the frontend, so they
        # come from the committed deploy/site.env, the same file the server
        # deploys with; placeholders are refused.
        id: site
        run: python3 scripts/site_config.py --strict --github-output
      - name: Validate release configuration
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
          SITE_NAMESPACE: ${{ steps.site.outputs.image_namespace }}
        run: |
          namespace="ghcr.io/${REPOSITORY,,}"
          if [ -n "$SITE_NAMESPACE" ] && [ "$SITE_NAMESPACE" != "$namespace" ]; then
            echo "deploy/site.env names $SITE_NAMESPACE, but this repository publishes to $namespace" >&2
            exit 1
          fi
          echo "namespace=$namespace" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build and push the tested revision
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: infra/docker/${{ matrix.service }}/Dockerfile
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.image.outputs.namespace }}-${{ matrix.service }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ steps.site.outputs.site_url }}
            NEXT_PUBLIC_APP_NAME=${{ steps.site.outputs.app_name }}
            MEDIA_HOST=${{ steps.site.outputs.media_host }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
