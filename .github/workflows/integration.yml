name: Full stack integration

on:
  workflow_call:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  account-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - name: Generate local configuration
        run: python scripts/tasks.py bootstrap
      - name: Start the stack
        run: docker compose -f docker-compose.dev.yml up -d --build --wait --wait-timeout 180
      - name: Wait for Next.js
        run: |
          for _ in $(seq 1 90); do
            if curl --fail --silent http://localhost:3010/ > /dev/null; then exit 0; fi
            sleep 5
          done
          exit 1
      - name: Verify the complete account flow
        run: python scripts/smoke.py
      - name: Service logs on failure
        if: failure()
        run: docker compose -f docker-compose.dev.yml logs --tail 150
      - name: Stop services
        if: always()
        run: docker compose -f docker-compose.dev.yml down
