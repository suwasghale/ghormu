# The edge for every site on the server (see nginx.conf beside this file).
#
# Installed at /srv/edge, outside any site's checkout, by scripts/edge.py,
# which every site's deploy runs. Sites register in ./sites. docs/EDGE.md.

name: edge

services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    # The host's own network: it listens on the public 80 and 443 and
    # reaches each site's nginx on 127.0.0.1.
    network_mode: host
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./sites:/etc/edge/sites:ro
    healthcheck:
      test: ["CMD-SHELL", "nginx -t -q"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
