# sg-edge v1
# ==============================================================================
# The edge: the one process on the server that owns ports 80 and 443
# ==============================================================================
#
# Every site on the server runs its own Compose stack with its own nginx,
# certificates and deploys. Only one process can listen on 443, so this one
# does, and hands each connection to the right site:
#
#   HTTPS  It reads the name the browser asks for (SNI) and forwards the
#          still-encrypted connection; TLS ends at the site's own nginx, with
#          its own certificate. PROXY protocol carries the visitor's address,
#          so each site's rate limits and Django see the real client.
#   HTTP   It forwards by Host header. Plain HTTP only serves certbot's
#          challenge and redirects to HTTPS, both done by the site.
#
# This file never names a site. Each site's deploy writes its own routes to
# /srv/edge/sites/<slug>.https.map and <slug>.http.map (scripts/edge.py
# register) and reloads. docs/EDGE.md has the details.
#
# The first line is a version marker: scripts/edge.py upgrades an installed
# copy with a lower number and migrates one without a marker.

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log  warn;
pid        /var/run/nginx.pid;

# Each proxied connection holds two descriptors; the container's default
# limit of 1024 would cap the edge near 500 connections.
worker_rlimit_nofile  65535;

events {
    worker_connections  4096;
}

stream {
    map $ssl_preread_server_name $https_site {
        hostnames;
        include  /etc/edge/sites/*.https.map;
        # No registered name (an old client, or a scan of the bare IP): the
        # connection is refused rather than given to an arbitrary site.
        default  127.0.0.1:1;
    }

    server {
        listen       443;
        listen       [::]:443;
        ssl_preread  on;
        proxy_pass   $https_site;
        proxy_protocol  on;
        proxy_connect_timeout  5s;
    }
}

http {
    map $host $http_site {
        hostnames;
        include  /etc/edge/sites/*.http.map;
        default  "";
    }

    access_log  off;

    server {
        listen  80  default_server;
        listen  [::]:80  default_server;

        location / {
            if ($http_site = "") {
                return  444;
            }
            proxy_pass  http://$http_site;
            proxy_set_header  Host             $host;
            proxy_set_header  X-Forwarded-For  $remote_addr;
            proxy_connect_timeout  5s;
        }
    }
}
