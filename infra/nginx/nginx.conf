# ==============================================================================
# nginx main configuration
# ==============================================================================
#
# Terminates TLS and forwards to Gunicorn. Site-specific server blocks
# live in conf.d/ (mounted from infra/nginx/sites).
#
# The forwarding headers here are load-bearing, not decoration:
# TRUSTED_PROXY_COUNT in Django reads X-Forwarded-For from the right,
# and SECURE_PROXY_SSL_HEADER needs X-Forwarded-Proto or
# SECURE_SSL_REDIRECT loops forever behind TLS termination.

user  nginx;

# One worker per core.
worker_processes  auto;

# Must exceed worker_connections or nginx runs out of file descriptors
# under load rather than reporting a useful error.
worker_rlimit_nofile  65535;

error_log  /var/log/nginx/error.log  warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;

    # Accept as many connections as possible per wakeup.
    multi_accept  on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # --------------------------------------------------------------------------
    # Logging
    # --------------------------------------------------------------------------

    # $upstream_response_time separates "the app is slow" from "the
    # network is slow", which is the first question during an incident.
    log_format  main
        '$remote_addr - $remote_user [$time_local] "$request" '
        '$status $body_bytes_sent "$http_referer" '
        '"$http_user_agent" "$http_x_forwarded_for" '
        'rt=$request_time urt=$upstream_response_time';

    access_log  /var/log/nginx/access.log  main;

    # --------------------------------------------------------------------------
    # Transfer
    # --------------------------------------------------------------------------

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;

    keepalive_timeout   65;
    keepalive_requests  1000;

    # Bounds how long a slow client can hold a worker.
    client_body_timeout   30s;
    client_header_timeout 30s;
    send_timeout          30s;

    # Must be at least as large as Django's
    # DATA_UPLOAD_MAX_MEMORY_SIZE, or nginx rejects an upload with 413
    # before Django ever sees it and can return a useful error.
    client_max_body_size  20m;

    # Silences the bucket-size warning on hosts with long names.
    server_names_hash_bucket_size  64;

    # --------------------------------------------------------------------------
    # Compression
    # --------------------------------------------------------------------------

    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_types
        application/javascript
        application/json
        application/xml
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # --------------------------------------------------------------------------
    # Rate limiting
    # --------------------------------------------------------------------------
    #
    # A coarse net in front of the application, not a replacement for
    # its throttles. Django's limits are per-scope and per-account and
    # know what an endpoint costs; these only stop a flood reaching
    # Gunicorn at all.

    limit_req_zone  $binary_remote_addr  zone=api:10m    rate=30r/s;
    limit_req_zone  $binary_remote_addr  zone=auth:10m   rate=2r/s;
    limit_conn_zone $binary_remote_addr  zone=conn:10m;

    # --------------------------------------------------------------------------
    # Upstream
    # --------------------------------------------------------------------------

    upstream backend {
        # `web` is the service name in docker-compose.prod.yml. This
        # said `backend:8000`, which resolves to nothing — nginx exits
        # at start-up with "host not found in upstream" and the whole
        # stack comes up without a reachable front door.
        server web:8000;

        # Reuse connections to Gunicorn instead of a handshake per
        # request. Requires HTTP/1.1 and a cleared Connection header in
        # the location block.
        keepalive  32;
    }

    # --------------------------------------------------------------------------
    # TLS defaults
    # --------------------------------------------------------------------------

    ssl_protocols              TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers  off;
    ssl_ciphers                ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;

    ssl_session_cache          shared:SSL:10m;
    ssl_session_timeout        1d;
    ssl_session_tickets        off;

    include /etc/nginx/conf.d/*.conf;
}
