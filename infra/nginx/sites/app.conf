# ==============================================================================
# Site server blocks
# ==============================================================================
#
# Replace example.com with your hostname. That name must also appear
# in ALLOWED_HOSTS, or Django returns 400 for every request.
#
# Certificates are expected at /etc/nginx/certs, mounted by the compose
# file. With certbot in webroot mode:
#
#   certbot certonly --webroot -w /var/www/certbot -d example.com
#
# and point ssl_certificate at /etc/letsencrypt/live/<host>/.

# ------------------------------------------------------------------------------
# Shared proxy headers
# ------------------------------------------------------------------------------

# $proxy_add_x_forwarded_for APPENDS to whatever the client sent, so
# the chain contains attacker-controlled entries on the left. That is
# exactly why Django's TRUSTED_PROXY_COUNT reads from the right - set
# it to 1 when this is the only proxy.
proxy_set_header  Host               $host;
proxy_set_header  X-Real-IP          $remote_addr;
proxy_set_header  X-Forwarded-For    $proxy_add_x_forwarded_for;
proxy_set_header  X-Forwarded-Proto  $scheme;
proxy_set_header  X-Forwarded-Host   $host;
proxy_set_header  X-Forwarded-Port   $server_port;

# Required for upstream keepalive to take effect.
proxy_http_version  1.1;
proxy_set_header    Connection  "";

proxy_connect_timeout  5s;
proxy_send_timeout     60s;
proxy_read_timeout     60s;

proxy_buffering    on;
proxy_buffer_size  8k;
proxy_buffers      16 8k;

# ------------------------------------------------------------------------------
# HTTP: redirect to HTTPS, except the ACME challenge
# ------------------------------------------------------------------------------

server {
    listen       80;
    listen       [::]:80;
    server_name  example.com;

    # Certbot must reach this over plain HTTP, so it cannot be caught
    # by the redirect below.
    location /.well-known/acme-challenge/ {
        root  /var/www/certbot;
    }

    location / {
        return  301  https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# HTTPS
# ------------------------------------------------------------------------------

server {
    listen       443 ssl;
    listen       [::]:443 ssl;
    http2        on;

    server_name  example.com;

    ssl_certificate      /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key  /etc/nginx/certs/privkey.pem;

    # OCSP stapling. Needs a resolver to fetch the response.
    ssl_stapling         on;
    ssl_stapling_verify  on;
    resolver             1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout     5s;


    client_max_body_size 20m;
    location /api/schema/ { proxy_pass http://backend; }
    location /api/v1/ { proxy_pass http://backend; }
    location /health/ { proxy_pass http://backend; }
    location /django-admin/ { proxy_pass http://backend; }
    location /static/ { proxy_pass http://backend; }
    location /api/media/ { alias /var/www/media/; add_header X-Content-Type-Options nosniff; }
    location /media/ { alias /var/www/media/; add_header X-Content-Type-Options nosniff; }
    location / { proxy_pass http://frontend:3000; }
}
